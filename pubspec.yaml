name: texter
description: Texter - Flutter messaging app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  appwrite: ^13.0.0
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  unity_ads_plugin: ^0.4.0
  uuid: ^4.5.1
  file_picker: ^10.3.3
  url_launcher: ^6.3.1
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  flutter_web_auth_2: ^4.1.0
  
