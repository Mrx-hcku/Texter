name: Build Texter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold missing android/ platform folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.texter --project-name texter .
          fi

      - name: Apply custom AndroidManifest
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set minSdkVersion and compileSdk in app/build.gradle.kts safely
        run: |
          python3 -c '
          import re
          build_path = "android/app/build.gradle.kts"
          with open(build_path, "r") as f:
              content = f.read()
          
          # Set minSdk to 23
          content = re.sub(r"minSdk\s*=\s*.*", "minSdk = 23", content)
          content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 23", content)
          
          # Set compileSdk to 35
          content = re.sub(r"compileSdk\s*=\s*.*", "compileSdk = 35", content)
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 35", content)
          
          # Set ndkVersion
          if "ndkVersion" in content:
              content = re.sub(r"ndkVersion\s*=.*", "ndkVersion = \"25.1.8937393\"", content)
          else:
              content = content.replace("defaultConfig {", "defaultConfig {\n        ndkVersion = \"25.1.8937393\"")

          with open(build_path, "w") as f:
              f.write(content)
          print("Successfully updated app/build.gradle.kts")
          '

      - name: Update Gradle wrapper to 9.3.1 (Required by latest Flutter AGP)
        run: |
          python3 -c '
          import re
          prop_path = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(prop_path, "r") as f:
              prop_content = f.read()
          prop_content = re.sub(r"distributionUrl=.*", "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip", prop_content)
          with open(prop_path, "w") as f:
              f.write(prop_content)
          print("Successfully updated gradle wrapper to 9.3.1")
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Clear old Kotlin modules to prevent cache metadata mismatch
        run: |
          find "$HOME/.pub-cache" -name "*.kotlin_module" -delete || true

      - name: Patch cached plugin packages for compileSdk/minSdk
        run: |
          find "$HOME/.pub-cache" -path "*/android/build.gradle*" 2>/dev/null | while read f; do
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' "$f" || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$f" || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$f" || true
          done

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: texter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
